services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: ra, POSTGRES_PASSWORD: ra, POSTGRES_DB: ra }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ra"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://ra:ra@db:5432/ra
      DATA_DIR: /data
      GROBID_URL: ${GROBID_URL:-}
      HF_HOME: /hf-cache
      HF_HUB_ETAG_TIMEOUT: 3
      HF_HUB_DOWNLOAD_TIMEOUT: 20
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes: [appdata:/data, hf-cache:/hf-cache]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    depends_on: [backend]
    ports: ["3000:3000"]
  grobid:                      # optional: docker compose --profile grobid up  (set GROBID_URL=http://grobid:8070)
    image: lfoppiano/grobid:0.8.1
    profiles: [grobid]
    ports: ["8070:8070"]
volumes: { pgdata: {}, appdata: {}, hf-cache: {} }
